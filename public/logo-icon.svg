<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-label="Rangkuman.news">
  <!-- 3 motion lines (left of the R) -->
  <rect x="6" y="24" width="36" height="7" rx="3.5" fill="#14B8A6"/>
  <rect x="6" y="42" width="36" height="7" rx="3.5" fill="#14B8A6"/>
  <rect x="6" y="60" width="36" height="7" rx="3.5" fill="#F7931A"/>

  <!-- R letterform — constructed from primitives
       (stem + top + bowl + diagonal leg) -->
  <!-- Stem (left vertical) -->
  <rect x="50" y="14" width="18" height="92" fill="#1E3A8A"/>
  <!-- Top arm (horizontal) -->
  <rect x="50" y="14" width="48" height="18" fill="#1E3A8A"/>
  <!-- Right side of top (rounded) -->
  <path d="M 98 14 Q 110 14 110 26 L 110 38 Q 110 50 98 50 L 80 50 L 80 32 L 98 32 Z" fill="#1E3A8A"/>
  <!-- Bowl bottom (horizontal connecting back to stem) -->
  <rect x="50" y="50" width="48" height="18" fill="#1E3A8A"/>
  <!-- Diagonal leg -->
  <path d="M 80 68 L 100 68 L 116 106 L 96 106 Z" fill="#1E3A8A"/>

  <!-- Teal leg detail (smaller R's leg inside the main R's leg) -->
  <path d="M 90 76 L 100 76 L 109 100 L 99 100 Z" fill="#14B8A6"/>
</svg>
