server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match Next.js `trailingSlash: true`: add trailing slash to clean URLs
    rewrite ^([^.]*[^/])$ $1/ permanent;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.api+json
        application/wasm
        image/svg+xml;

    # Long-lived cache for fingerprinted Next assets and other static files
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve Next-generated 404 on missing routes
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }

    # Default location: try the file, fall back to its directory's index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}